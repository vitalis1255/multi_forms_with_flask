<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Multi-Step Form{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="main-container">
      <!-- Sidebar Navigation -->
      <div class="sidebar">
        <div class="step-item {% if step == 1 %}active{%    endif %}">
          <div class="step-number">1</div>
          <div class="step-info">
            <div class="step-label">Step 1</div>
            <div class="step-title">Your Info</div>
          </div>
        </div>
        <div class="step-item {% if step == 2 %}active{% endif %}">
          <div class="step-number">2</div>
          <div class="step-info">
            <div class="step-label">Step 2</div>
            <div class="step-title">Select Plan</div>
          </div>
        </div>
        <div class="step-item {% if step == 3 %}active{% endif %}">
          <div class="step-number">3</div>
          <div class="step-info">
            <div class="step-label">Step 3</div>
            <div class="step-title">Add-ons</div>
          </div>
        </div>
        <div class="step-item {% if step == 4 %}active{% endif%}">
          <div class="step-number">4</div>
          <div class="step-info">
            <div class="step-label">Step 4</div>
            <div class="step-title">Summary</div>
          </div>
        </div>
      </div>

      <!-- Form Dynamic Content Area for all steps -->
       <div class="form-content">
        {% block content %}{% endblock %}
       </div>
    </div>
  </body>
</html>
